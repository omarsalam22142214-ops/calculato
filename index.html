<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casio Pro Calculator</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="./icon.png">

    <style>
        :root {
            --bg-color: #c4ccd3; --calc-bg-top: #dcdfe5; --calc-bg-bottom: #a3a8b0;
            --brand-color: #2c3e50; --screen-bg: #9cb5a2; --screen-border: #6b7778;
            --text-color: #111; --num-btn-bg: #f8f9fa; --num-btn-color: #2c3e50;
            --sci-btn-bg: #2c3e50; --sci-btn-color: #ecf0f1; --shadow-color: rgba(0,0,0,0.5);
            --toggle-btn-bg: #2c3e50; --toggle-btn-color: #fff;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e; --calc-bg-top: #222831; --calc-bg-bottom: #171b21;
            --brand-color: #eeeeee; --screen-bg: #6e8273; --screen-border: #393e46;
            --text-color: #000; --num-btn-bg: #393e46; --num-btn-color: #eeeeee;
            --sci-btn-bg: #111418; --sci-btn-color: #00adb5; --shadow-color: rgba(0,0,0,0.8);
            --toggle-btn-bg: #f1c40f; --toggle-btn-color: #111;
        }

        body {
            background-color: var(--bg-color); margin: 0;
            font-family: 'Arial', sans-serif; user-select: none; transition: background-color 0.4s ease; 
            overflow: hidden; touch-action: none; 
            /* التعديل لضمان التوسيط على شاشات الديسكتوب مع الاحتفاظ بشكل الموبايل */
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        .calculator {
            background: linear-gradient(to bottom, var(--calc-bg-top), var(--calc-bg-bottom));
            padding: max(env(safe-area-inset-top), 15px) 15px max(env(safe-area-inset-bottom), 15px);
            box-sizing: border-box; 
            width: 100vw; 
            max-width: 420px; /* إجبار العرض على مقاس الموبايل دائماً */
            height: 100dvh; 
            max-height: 900px; /* إجبار الطول على مقاس الموبايل */
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 10px 40px var(--shadow-color); /* ظل خارجي لشكل جمالي على الديسكتوب */
            transition: background 0.4s ease;
        }

        .brand-area {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; padding: 0 5px; height: 50px; flex-shrink: 0;
        }

        .brand { font-weight: 900; font-size: 22px; color: var(--brand-color); letter-spacing: 1px;}
        .model { font-size: 10px; font-style: italic; color: #16a085; font-weight: bold; }

        .theme-toggle {
            padding: 6px 12px; border: none; border-radius: 15px; font-size: 11px;
            background-color: var(--toggle-btn-bg); color: var(--toggle-btn-color);
            font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        .screen-container {
            background-color: var(--screen-bg); padding: 10px; border-radius: 8px;
            border: 3px solid var(--screen-border); box-shadow: inset 0 3px 10px rgba(0,0,0,0.25);
            margin-bottom: 15px; flex-shrink: 0; height: 20%; min-height: 90px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        
        .screen-indicators { font-size: 10px; font-family: monospace; font-weight: bold; color: var(--text-color); display: flex; gap: 12px; }
        
        .screen-expression { 
            width: 100%; border: none; background: transparent; text-align: left; 
            font-size: 26px; font-family: 'Courier New', Courier, monospace; color: var(--text-color); 
            outline: none; letter-spacing: 2px; cursor: text; margin-top: 5px;
        }
        
        .screen-result { 
            width: 100%; text-align: right; font-size: 34px; font-weight: bold; 
            font-family: 'Courier New', Courier, monospace; color: var(--text-color); min-height: 35px; 
        }

        .keypad { display: flex; flex-direction: column; flex-grow: 1; gap: 2%; }
        .row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2%; height: 10%; min-height: 55px; flex-shrink: 0;}
        .row-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2%; flex-grow: 1; }
        
        button {
            border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 4px 0 rgba(0,0,0,0.3); transition: 0.1s; 
            position: relative; width: 100%; height: 100%; padding: 0; display: flex; align-items: center; justify-content: center;
        }
        button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); }

        .d-pad {
            position: relative; width: 85px; height: 60px; background-color: var(--screen-border);
            border-radius: 30px; display: flex; justify-content: center; align-items: center;
            border: 2px solid var(--sci-btn-bg); box-shadow: inset 0 2px 5px rgba(255,255,255,0.2), 0 4px 0 rgba(0,0,0,0.4);
        }
        .dir-btn { position: absolute; background: transparent; color: var(--text-color); border: none; font-size: 12px; cursor: pointer; padding: 5px; box-shadow: none; font-weight: bold; width: auto; height: auto;}
        .dir-btn:active { transform: scale(0.8); box-shadow: none; }
        .dir-btn.up { top: 0px; } .dir-btn.down { bottom: 0px; } .dir-btn.left { left: 4px; } .dir-btn.right { right: 4px; }
        .d-pad-center { font-size: 9px; color: var(--text-color); font-weight: bold; }

        .btn-shift { background-color: #f1c40f; color: #333; font-size: 11px; border-radius: 50%; height: 45px; width: 45px; }
        .btn-alpha { background-color: #e74c3c; color: white; font-size: 11px; border-radius: 50%; height: 45px; width: 45px; }
        .btn-on { background-color: var(--screen-border); color: var(--text-color); font-size: 11px; border-radius: 50%; height: 45px; width: 45px; }
        
        .btn-sci { background-color: var(--sci-btn-bg); color: var(--sci-btn-color); font-size: 14px; } 
        .btn-num, .btn-op { background-color: var(--num-btn-bg); color: var(--num-btn-color); font-size: 20px; } 
        .btn-del-ac { background-color: #e67e22; color: white; font-size: 16px; } 

        .alpha-text { position: absolute; top: 2px; right: 4px; font-size: 10px; color: #e74c3c; font-weight: bold; }
        .shift-text { position: absolute; top: 2px; left: 4px; font-size: 10px; color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body data-theme="dark">

    <div class="calculator" id="calculator">
        <div class="brand-area">
            <div>
                <div class="brand">CASIO</div>
                <div class="model">fx-991ES PLUS<br><span style="color:#555; font-size: 9px;">NATURAL-V.P.A.M.</span></div>
            </div>
            <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">Light Mode ☀️</button>
        </div>

        <div class="screen-container">
            <div class="screen-indicators">
                <span id="shift-indicator" style="opacity: 0.2;">S</span> 
                <span id="alpha-indicator" style="opacity: 0.2;">A</span> 
                <span>D</span> <span>Math</span>
            </div>
            <input type="text" id="expression" class="screen-expression" inputmode="none" value="" autofocus="">
            <div id="result" class="screen-result">0</div>
        </div>

        <div class="keypad">
            <div class="row-top">
                <button class="btn-shift" onclick="toggleShift()">SHIFT</button>
                <button class="btn-alpha" onclick="toggleAlpha()">ALPHA</button> 
                
                <div class="d-pad">
                    <button class="dir-btn up" onclick="moveCursor('up')">▲</button>
                    <button class="dir-btn left" onclick="moveCursor('left')">◀</button>
                    <button class="dir-btn right" onclick="moveCursor('right')">▶</button>
                    <button class="dir-btn down" onclick="moveCursor('down')">▼</button>
                    <span class="d-pad-center">REPLAY</span>
                </div>

                <button class="btn-on">MODE</button>
                <button class="btn-on" onclick="clearScreen()">ON</button>
            </div>

            <div class="row-5">
                <button class="btn-sci" onclick="insert('abs(')">abs</button>
                <button class="btn-sci" onclick="insert('^3')">x<sup>3</sup></button>
                <button class="btn-sci" onclick="handleShiftBtn('!', '^-1')"><span class="shift-text">x!</span>x<sup>-1</sup></button> 
                <button class="btn-sci" onclick="insert('log(')">log</button>
                <button class="btn-sci" onclick="insert('ln(')">ln</button>
            </div>
            <div class="row-5">
                <button class="btn-sci" onclick="insert('pi')">π</button>
                <button class="btn-sci" onclick="insert('sqrt(')">√</button>
                <button class="btn-sci" onclick="insert('^2')">x<sup>2</sup></button>
                <button class="btn-sci" onclick="insert('^')">x<sup>^</sup></button>
                <button class="btn-sci" onclick="insert('*10^')">10<sup>x</sup></button>
            </div>
            <div class="row-5">
                <button class="btn-sci" onclick="handleAlphaBtn('A', '-')"><span class="alpha-text">A</span>(-)</button> 
                <button class="btn-sci" onclick="insert('Ans')">Ans</button>
                <button class="btn-sci" onclick="handleAlphaBtn('B', 'hyp')"><span class="alpha-text">B</span>hyp</button> 
                <button class="btn-sci" id="btn-sin" onclick="insertTrig('sin')">sin</button>
                <button class="btn-sci" id="btn-cos" onclick="insertTrig('cos')">cos</button>
            </div>
            <div class="row-5">
                <button class="btn-sci" id="btn-tan" onclick="insertTrig('tan')">tan</button>
                <button class="btn-sci" onclick="handleAlphaBtn('X', '(')"><span class="alpha-text">X</span>(</button> 
                <button class="btn-sci" onclick="handleAlphaBtn('Y', ')')"><span class="alpha-text">Y</span>)</button> 
                <button class="btn-sci" onclick="insert('S&lt;=&gt;D')">S⇔D</button>
                <button class="btn-sci" onclick="handleAlphaBtn('M', 'M+')"><span class="alpha-text">M</span>M+</button> 
            </div>

            <div class="row-5">
                <button class="btn-num" onclick="insert('7')">7</button>
                <button class="btn-num" onclick="insert('8')">8</button>
                <button class="btn-num" onclick="insert('9')">9</button>
                <button class="btn-del-ac" onclick="deleteAtCursor()">DEL</button>
                <button class="btn-del-ac" onclick="clearScreen()">AC</button>
            </div>
            <div class="row-5">
                <button class="btn-num" onclick="insert('4')">4</button>
                <button class="btn-num" onclick="insert('5')">5</button>
                <button class="btn-num" onclick="insert('6')">6</button>
                <button class="btn-op" onclick="handleShiftBtn('P', '*')"><span class="shift-text">nPr</span>×</button> 
                <button class="btn-op" onclick="handleShiftBtn('C', '/')"><span class="shift-text">nCr</span>÷</button> 
            </div>
            <div class="row-5">
                <button class="btn-num" onclick="insert('1')">1</button>
                <button class="btn-num" onclick="insert('2')">2</button>
                <button class="btn-num" onclick="insert('3')">3</button>
                <button class="btn-op" onclick="insert('+')">+</button>
                <button class="btn-op" onclick="insert('-')">-</button>
            </div>
            <div class="row-5">
                <button class="btn-num" onclick="insert('0')">0</button>
                <button class="btn-num" onclick="insert('.')">.</button>
                <button class="btn-num" onclick="insert('*10^')">x10<sup>x</sup></button>
                <button class="btn-num" onclick="insert('Ans')">Ans</button>
                <button class="btn-num" onclick="calculate()">=</button>
            </div>
        </div>
    </div>

    <script>
        const exprInput = document.getElementById('expression');
        const resultDiv = document.getElementById('result');
        const shiftIndicator = document.getElementById('shift-indicator');
        const alphaIndicator = document.getElementById('alpha-indicator');
        const themeBtn = document.getElementById('theme-btn');
        
        let lastAnswer = "0";
        let isShifted = false;
        let isAlpha = false;
        
        let memory = { A: 0, B: 0, X: 0, Y: 0, M: 0 };

        function fact(n) {
            if (n < 0 || n % 1 !== 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let result = 1; for (let i = 2; i <= n; i++) result *= i; return result;
        }
        function nPr(n, r) { return fact(n) / fact(n - r); }
        function nCr(n, r) { return fact(n) / (fact(r) * fact(n - r)); }

        function sinD(x) { return Math.sin(x * Math.PI / 180); }
        function cosD(x) { return Math.cos(x * Math.PI / 180); }
        function tanD(x) { return Math.tan(x * Math.PI / 180); }
        function asinD(x) { return Math.asin(x) * 180 / Math.PI; }
        function acosD(x) { return Math.acos(x) * 180 / Math.PI; }
        function atanD(x) { return Math.atan(x) * 180 / Math.PI; }

        function toggleShift() {
            isShifted = !isShifted; isAlpha = false; updateIndicators();
        }

        function toggleAlpha() {
            isAlpha = !isAlpha; isShifted = false; updateIndicators();
        }

        function updateIndicators() {
            shiftIndicator.style.opacity = isShifted ? '1' : '0.2';
            alphaIndicator.style.opacity = isAlpha ? '1' : '0.2';
            
            const shiftBtn = document.querySelector('.btn-shift');
            shiftBtn.style.transform = isShifted ? 'scale(0.9)' : 'scale(1)';
            shiftBtn.style.boxShadow = isShifted ? 'none' : '0 4px 0 rgba(0,0,0,0.3)';
            
            const alphaBtn = document.querySelector('.btn-alpha');
            alphaBtn.style.transform = isAlpha ? 'scale(0.9)' : 'scale(1)';
            alphaBtn.style.boxShadow = isAlpha ? 'none' : '0 4px 0 rgba(0,0,0,0.3)';

            document.getElementById('btn-sin').innerHTML = isShifted ? 'sin<sup>-1</sup>' : 'sin';
            document.getElementById('btn-cos').innerHTML = isShifted ? 'cos<sup>-1</sup>' : 'cos';
            document.getElementById('btn-tan').innerHTML = isShifted ? 'tan<sup>-1</sup>' : 'tan';
        }

        function insertTrig(type) {
            if (isShifted) { insert(type + '^-1('); toggleShift(); } 
            else { insert(type + '('); }
        }

        function handleAlphaBtn(alphaVal, normalVal) {
            if (isAlpha) { insert(alphaVal); toggleAlpha(); } else { insert(normalVal); }
        }

        function handleShiftBtn(shiftVal, normalVal) {
            if (isShifted) { insert(shiftVal); toggleShift(); } else { insert(normalVal); }
        }

        function insert(value) {
            let start = exprInput.selectionStart;
            let text = exprInput.value;
            exprInput.value = text.substring(0, start) + value + text.substring(start);
            exprInput.selectionStart = exprInput.selectionEnd = start + value.length;
            exprInput.focus();
        }

        function moveCursor(dir) {
            let pos = exprInput.selectionStart;
            if (dir === 'left' && pos > 0) pos--;
            if (dir === 'right' && pos < exprInput.value.length) pos++;
            if (dir === 'up') pos = 0; 
            if (dir === 'down') pos = exprInput.value.length; 
            exprInput.selectionStart = exprInput.selectionEnd = pos;
            exprInput.focus();
        }

        function deleteAtCursor() {
            let start = exprInput.selectionStart;
            if (start === 0) return;
            let text = exprInput.value;
            exprInput.value = text.substring(0, start - 1) + text.substring(start);
            exprInput.selectionStart = exprInput.selectionEnd = start - 1;
            exprInput.focus();
        }

        function clearScreen() { 
            exprInput.value = ""; resultDiv.innerText = "0";
            if(isShifted) toggleShift(); if(isAlpha) toggleAlpha();
            exprInput.focus();
        }

        function calculate() {
            let expr = exprInput.value;
            if (expr === "") return;

            expr = expr.replace(/(\d+)\(/g, '$1*(');
            expr = expr.replace(/(\d+)([ABXYM])/g, '$1*$2');
            expr = expr.replace(/\)\(/g, ')*(');
            expr = expr.replace(/([ABXYM])\(/g, '$1*(');
            expr = expr.replace(/([ABXYM])([ABXYM])/g, '$1*$2');

            expr = expr.replace(/A/g, `(${memory.A})`).replace(/B/g, `(${memory.B})`)
                       .replace(/X/g, `(${memory.X})`).replace(/Y/g, `(${memory.Y})`)
                       .replace(/M/g, `(${memory.M})`);

            expr = expr.replace(/(\d+)!/g, 'fact($1)');
            expr = expr.replace(/(\d+)P(\d+)/g, 'nPr($1,$2)');
            expr = expr.replace(/(\d+)C(\d+)/g, 'nCr($1,$2)');
            
            let mathString = expr
                .replace(/pi/g, 'Math.PI')
                .replace(/Ans/g, lastAnswer).replace(/\^/g, '**')
                .replace(/sin\^-1\(/g, 'asinD(').replace(/cos\^-1\(/g, 'acosD(').replace(/tan\^-1\(/g, 'atanD(')
                .replace(/sin\(/g, 'sinD(').replace(/cos\(/g, 'cosD(').replace(/tan\(/g, 'tanD(')
                .replace(/log\(/g, 'Math.log10(').replace(/ln\(/g, 'Math.log(').replace(/sqrt\(/g, 'Math.sqrt(').replace(/abs\(/g, 'Math.abs(');
            
            try {
                let result = eval(mathString);
                if (result % 1 !== 0) result = parseFloat(result.toFixed(8));
                resultDiv.innerText = result;
                lastAnswer = result; 
                exprInput.selectionStart = exprInput.selectionEnd = exprInput.value.length;
            } catch (error) { resultDiv.innerText = 'Syntax ERROR'; }
        }

        function toggleTheme() {
            const body = document.body; 
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme'); themeBtn.innerHTML = 'Dark Mode &#127769;';
            } else {
                body.setAttribute('data-theme', 'dark'); themeBtn.innerHTML = 'Light Mode &#9728;&#65039;';
            }
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(registration => { console.log('SW Registered'); })
                .catch(error => { console.log('SW Failed:', error); });
            });
        }
    </script>

</body></html>
